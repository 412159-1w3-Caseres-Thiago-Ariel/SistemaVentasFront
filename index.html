<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen relative p-4 md:p-10 font-sans">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        
        <img src="dino feliz.webp" alt="Dino Feliz" 
             class="absolute top-12 left-2 md:left-10 w-24 md:w-36 lg:w-44 opacity-80 transform -rotate-12 drop-shadow-lg">

        <img src="pollitos.webp" alt="Pollitos" 
             class="absolute top-1/3 right-2 md:right-16 w-28 md:w-40 lg:w-48 opacity-80 transform rotate-6 drop-shadow-lg">

        <img src="dino triste.webp" alt="Dino Triste" 
             class="absolute top-1/2 left-2 md:left-8 w-20 md:w-32 lg:w-40 opacity-80 transform rotate-12 drop-shadow-lg">
             
    </div>
    <div class="max-w-2xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-6 relative z-10 border border-white/50">
        
        <header class="border-b border-gray-200 pb-4 mb-6">
            <h1 class="text-3xl font-extrabold text-gray-900">Gestión de Clientes</h1>
            <p class="text-gray-600 font-medium">Historial detallado de compras y saldos</p>
        </header>

        <div class="mb-6 p-4 border border-purple-200 bg-purple-50/90 rounded-xl shadow-sm">
            <h2 class="text-sm font-bold text-purple-800 mb-2 uppercase tracking-wide">👤 Registrar Nuevo Cliente</h2>
            <div class="flex gap-2">
                <input type="text" id="nuevo-cliente-nombre" placeholder="Nombre" class="w-1/2 rounded-md border-gray-300 border p-2 focus:ring-purple-500 focus:border-purple-500">
                <input type="text" id="nuevo-cliente-apellido" placeholder="Apellido" class="w-1/2 rounded-md border-gray-300 border p-2 focus:ring-purple-500 focus:border-purple-500">
                <button onclick="registrarCliente()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-sm">
                    Guardar
                </button>
            </div>
        </div>

        <div class="mb-6 p-4 border border-orange-200 bg-orange-50/90 rounded-xl shadow-sm">
            <h2 class="text-sm font-bold text-orange-800 mb-2 uppercase tracking-wide">📦 Agregar Producto al Catálogo</h2>
            <div class="flex flex-col gap-3">
                <div class="flex gap-2">
                    <input type="text" id="nuevo-producto-nombre" placeholder="Ej: Fragancia Joy Emotion" class="w-2/3 rounded-md border-gray-300 border p-2 focus:ring-orange-500 focus:border-orange-500">
                    <select id="nuevo-producto-categoria" class="w-1/3 rounded-md border-gray-300 border p-2 focus:ring-orange-500 focus:border-orange-500 bg-white">
                        <option value="">Categoría...</option>
                        <option value="Fragancias">Fragancias</option>
                        <option value="Cuidado de la piel">Cuidado de la piel</option>
                        <option value="Maquillaje">Maquillaje</option>
                        <option value="Cuidado del cuerpo">Cuidado del cuerpo</option>
                        <option value="Promociones/Varios">Promociones/Varios</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="nuevo-producto-precio" placeholder="Precio ($)" class="w-1/2 rounded-md border-gray-300 border p-2 focus:ring-orange-500 focus:border-orange-500">
                    <button onclick="registrarProducto()" class="w-1/2 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-sm">
                        Guardar Producto
                    </button>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="combo-clientes" class="block text-sm font-medium text-gray-800 mb-1">Seleccionar Cliente</label>
            <div class="flex gap-2">
                <select id="combo-clientes" class="block w-full rounded-md border-gray-300 border p-3 text-gray-800 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white">
                    <option value="">Cargando clientes...</option>
                </select>
                
                <button onclick="eliminarCliente()" class="bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-700 border border-red-200 px-4 rounded-md transition-colors shadow-sm" title="Archivar este cliente">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="mb-6 p-4 border border-blue-200 bg-blue-50/90 rounded-xl shadow-sm">
            <h2 class="text-sm font-bold text-blue-800 mb-2 uppercase tracking-wide">Cargar Nueva Venta</h2>
            <div class="flex flex-col gap-3">
                <select id="combo-productos" class="w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="">Cargando productos...</option>
                </select>
                
                <div class="flex gap-2">
                    <input type="number" id="venta-cantidad" placeholder="Cant." class="w-1/4 rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500">
                    <input type="number" id="venta-precio" placeholder="Precio un. ($)" class="w-1/2 rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500">
                    <input type="number" id="venta-entrega" placeholder="Entregó ($)" class="w-1/4 rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <button onclick="registrarVenta()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full transition-all shadow-sm">
                    Guardar Venta
                </button>
            </div>
        </div>

        <button onclick="cargarHistorial()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl w-full transition-all shadow-md mb-8">
            Ver Historial del Cliente
        </button>

        <div id="resumen-deuda" class="mb-6"></div>

        <div id="resultado-historial" class="grid grid-cols-1 gap-4"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
