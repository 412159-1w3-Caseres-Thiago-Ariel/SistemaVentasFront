<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas - Gestión de Clientes - BCH</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl md:text-4xl font-black text-indigo-900 tracking-tight">Gestión de Clientes</h1>
            <p class="text-gray-500 font-medium mt-1">Historial detallado de compras y saldos - BCH</p>
        </header>

        <section class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-purple-100 mb-6">
            <h2 class="text-purple-700 font-bold mb-4 flex items-center gap-2 text-sm md:text-base uppercase tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 md:w-6 md:h-6 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                REGISTRAR NUEVO CLIENTE
            </h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="nuevo-cliente-nombre" placeholder="Nombre" class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                <input type="text" id="nuevo-cliente-apellido" placeholder="Apellido" class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                <button onclick="registrarCliente()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-xl w-full sm:w-auto shadow-sm transition-all">
                    Guardar
                </button>
            </div>
        </section>

        <section class="bg-orange-50 p-5 md:p-6 rounded-2xl shadow-sm border border-orange-200 mb-6">
            <h2 class="text-orange-800 font-bold mb-4 flex items-center gap-2 text-sm md:text-base uppercase tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 md:w-6 md:h-6 text-orange-700">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
                </svg>
                AGREGAR PRODUCTO AL CATÁLOGO
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <input type="text" id="nuevo-producto-nombre" placeholder="Ej: Fragancia Joy Emotion" class="border border-gray-300 p-3 rounded-xl w-full lg:col-span-2 outline-none focus:ring-2 focus:ring-orange-400">
                <input type="text" id="nuevo-producto-categoria" placeholder="Categoría..." class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-orange-400">
                <input type="number" id="nuevo-producto-precio" placeholder="Precio ($)" class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mt-3">
                <button onclick="registrarProducto()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-xl w-full sm:w-auto shadow-sm transition-all">
                    Guardar Producto
                </button>
            </div>
        </section>

        <section class="bg-blue-50/50 p-5 md:p-6 rounded-2xl shadow-sm border border-blue-200 mb-6">
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Seleccionar Cliente</label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <select id="combo-clientes" onchange="cargarHistorial()" class="border border-gray-300 p-3 rounded-xl w-full bg-white text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 font-medium cursor-pointer">
                        <option value="">-- Seleccione un cliente --</option>
                    </select>
                    <button onclick="eliminarCliente()" class="bg-red-50 hover:bg-red-100 text-red-500 p-3 rounded-xl border border-red-200 transition-colors w-full sm:w-auto flex justify-center items-center" title="Eliminar Cliente">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-blue-100 shadow-sm">
                <h3 class="text-blue-800 font-bold mb-4 uppercase text-sm tracking-wide">Cargar Nueva Venta</h3>
                
                <select id="combo-productos" class="border border-gray-300 p-3 rounded-xl w-full mb-4 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                    <option value="">-- Seleccione un producto --</option>
                </select>
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1 ml-1">Cantidad</label>
                        <input type="number" id="venta-cantidad" placeholder="Cant." class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-blue-400 text-center">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1 ml-1">Precio un. ($)</label>
                        <input type="number" id="venta-precio" placeholder="$ 0.00" class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-blue-400 text-center">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1 ml-1">Entrega ($)</label>
                        <input type="number" id="venta-entrega" placeholder="Opcional" class="border border-gray-300 p-3 rounded-xl w-full outline-none focus:ring-2 focus:ring-blue-400 text-center">
                    </div>
                </div>
                
                <button onclick="registrarVenta()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl w-full shadow-sm transition-all text-lg">
                    Guardar Venta
                </button>
            </div>
            
            <button onclick="cargarHistorial()" class="mt-4 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-3 px-4 rounded-xl w-full transition-colors sm:hidden">
                Actualizar Historial
            </button>
        </section>

        <section>
            <div id="resumen-deuda" class="mb-6"></div>
            
            <div id="resultado-historial" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                </div>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
